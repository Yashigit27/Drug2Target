# Global defaults for the pipeline (override per env or future CLI flags)

species: human

open_targets:
  graphql_url: https://api.platform.opentargets.org/api/v4/graphql
  search:
    entity: disease
    max_hits: 15
  associations:
    page_size: 500
    # Set to null to fetch all rows reported by Open Targets (can be 10k+)
    max_rows: 8000

paths:
  storage_dir: storage
  outputs_dir: outputs
  data_raw_dir: data/raw
  registry_db: storage/registry/d2t_registry.db

# Literature RAG (Europe PMC + TF-IDF chunk retrieval + symbol validation)
literature_rag:
  enabled: true
  # Europe PMC query window (recent literature = “latest” in abstract sense)
  first_pdate_years_back: 3
  max_articles: 40
  page_size: 20
  # Retrieval: TF-IDF over abstract chunks
  chunks_per_abstract_max: 12
  chunk_max_chars: 450
  top_chunks_global: 80
  # Gene extraction from top chunks
  max_genes_per_run: 500
  # Query string for TF-IDF (targets / mechanism language)
  retrieval_query: "therapeutic target gene protein pathway drug biomarker novel candidate"

# Track A — known underexplored targets
track_a:
  enabled: true
  top_n_for_analysis: 120
  crowdedness_weights:
    publication_count: 0.45
    approved_drug_flag: 0.25
    clinical_flag: 0.20
    ligand_flag: 0.10
  final_ranking_weights:
    biological_relevance: 0.35
    cadd_readiness: 0.25
    tissue_relevance: 0.20
    low_crowdedness: 0.20
  crowded_high_quantile: 0.80
  crowded_extreme_quantile: 0.95

# Track B — novel candidate discovery
track_b:
  enabled: true
  seed_top_n: 60
  string_required_score: 400
  string_partners_per_seed: 40
  top_candidates_for_scoring: 180
  final_ranking_weights:
    network_support: 0.20
    pathway_relevance: 0.14
    expression_evidence: 0.16
    coexpression: 0.10
    functional_similarity: 0.08
    genetic_support: 0.08
    literature_weak_support: 0.08
    druggability: 0.08
    tissue_relevance: 0.08
  # B3 coexpression / tissue expression
  # provider: hybrid (GTEx if file present, else STRING) | gtex_tissue | string_proxy
  b3:
    provider: hybrid
    gtex_median_path: data/external/gtex/gene_median_tpm.gct.gz
    expression_weight: 0.7
    string_proxy_weight: 0.3
    default_tissue: brain
    # GTEx v11 column names use underscores (e.g. Brain_Cortex)
    tissue_map:
      brain: "Brain_Cortex"
      cortex: "Brain_Cortex"
      liver: "Liver"
      hepatic: "Liver"
      blood: "Whole_Blood"
      lung: "Lung"
      heart: "Heart_Left_Ventricle"
      kidney: "Kidney_Cortex"
      muscle: "Muscle_Skeletal"
      skin: "Skin_Sun_Exposed_Lower_leg"
      pancreas: "Pancreas"
      adipose: "Adipose_Subcutaneous"
      colon: "Colon_Transverse"
      stomach: "Stomach"
      thyroid: "Thyroid"
      nerve: "Nerve_Tibial"
      spleen: "Spleen"
      pituitary: "Pituitary"
  # B4 differential expression. One saved contrast per disease id + tissue group.
  # A disease with no row scores 0.5 (neutral), not zero.
  b4:
    default_tissue: brain
    min_abs_log2fc: 0.5
    max_pvalue: 0.05
    tissue_group:
      brain: [brain, cortex, nigra, substantia, hippocampus, hippocampal, frontal, gyrus, midbrain]
      liver: [liver, hepatic]
      blood: [blood]
    contrasts:
      # Parkinson substantia nigra, 16 disease vs 9 healthy (GSE7621).
      - disease_id: MONDO_0005180
        tissue: brain
        study: GSE7621
        file: data/external/de/E-GEOD-7621.tsv
        contrast: g1_g2
      # Alzheimer superior frontal gyrus vs healthy (GSE5281). Same file
      # for the late-onset id Step 1 selects when that subtype is typed.
      - disease_id: MONDO_0004975
        tissue: brain
        study: GSE5281
        file: data/external/de/E-GEOD-5281.tsv
        contrast: g12_g6
      - disease_id: EFO_1001870
        tissue: brain
        study: GSE5281
        file: data/external/de/E-GEOD-5281.tsv
        contrast: g12_g6
  # B7 hub check. Build once: python -m src.lib.track_b.string_background
  b7:
    string_db: data/external/string/9606.string.sqlite
    n_random: 100
    degree_window: 0.2
  # B9 tractability / structure / safety
  # provider: hybrid (OT + PDBe) | ot_tractability | defaults
  b9:
    provider: hybrid
    use_pdbe: true
    structure_weight: 0.4
    druggability_weight: 0.4
    safety_weight: 0.2
    max_genes: 200

# Tissue-context filter (literature + mygene summary)
tissue_filter:
  enabled: true
  max_genes_for_epmc: 80

# Fusion layer F1 — unified portfolio across tracks
fusion:
  enabled: true
  tier1_track_threshold: 0.65
  tier1_tissue_threshold: 0.70
  tier1_cadd_threshold: 0.60
  tier2_track_threshold: 0.40

# Optional LLM narrative (set OPENAI_API_KEY in .env)
llm:
  enabled: true
  model: gpt-4o-mini

